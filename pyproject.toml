[project]
name = "lexsi-unlearn"
version = "0.1.0"
description = "Lexsi Track 2b scaffold: unlearning vs hiding on CohereLabs/tiny-aya-global"
readme = "README.md"
requires-python = ">=3.12"
# Install on Colab / a GPU machine. Do not pip-install the heavy stack on this Mac.
dependencies = [
    "safetune>=0.1.12",
    "circuitkit>=0.2.0",
    "auditkit>=1.1.3",
    "transformers",
    "peft",
    "datasets",
    "accelerate",
    "huggingface_hub",
    "python-dotenv",
    "pyyaml",
    "scikit-learn",
    "numpy",
    "torch",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
